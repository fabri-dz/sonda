<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Medir lo pendiente</title>
<style>
  :root { --fondo: #f6f5f1; --papel: #fff; --tinta: #1c1b18; --tenue: #6b6860; --linea: #dedbd2; --acento: #1f7a4d; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --fondo: #16171a; --papel: #1f2125; --tinta: #ecebe6; --tenue: #9b9a92; --linea: #33363c; --acento: #4fc283; }
  }
  :root[data-theme="dark"] { --fondo: #16171a; --papel: #1f2125; --tinta: #ecebe6; --tenue: #9b9a92; --linea: #33363c; --acento: #4fc283; }
  body { margin: 0; padding: 16px; background: var(--fondo); color: var(--tinta);
    font: 16px/1.45 system-ui, Roboto, "Segoe UI", sans-serif; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { margin: 0 0 12px; color: var(--tenue); }
  pre { margin: 12px 0 0; padding: 10px; background: #fff; color: #000; border-radius: 10px;
    font: 600 12px/1.3 ui-monospace, "Roboto Mono", Consolas, monospace; white-space: pre-wrap;
    word-break: break-all; }
  .firma { display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; }
</style>
<body>
  <h1>Medir lo pendiente</h1>
  <p>No toques nada: tarda unos 15 segundos. Cuando diga <strong>listo</strong>, sacá una captura de toda la pantalla y mandala.</p>
  <div class="firma"><span id="estado">midiendo…</span><span id="firma"></span></div>
  <pre id="salida">—</pre>
<script>
(async () => {
  const o = {};
  const estado = (t) => { document.getElementById("estado").textContent = t; };

  // El modelo, para saber de qué teléfono es la captura.
  try {
    const h = await navigator.userAgentData.getHighEntropyValues(["model", "platformVersion"]);
    o.modelo = (h.model || "-") + " / " + navigator.userAgentData.platform + " " + h.platformVersion;
  } catch (e) { o.modelo = "ERR:" + e.name; }

  // Audio (GAB-142): el mismo grafo y el mismo redondeo que arnes.py, así se
  // compara con lo medido en escritorio.
  estado("midiendo el audio…");
  try {
    const ac = new OfflineAudioContext(1, 44100, 44100);
    const osc = ac.createOscillator(); osc.type = "triangle"; osc.frequency.value = 10000;
    const comp = ac.createDynamicsCompressor();
    osc.connect(comp); comp.connect(ac.destination); osc.start(0);
    const b = await ac.startRendering();
    const c = b.getChannelData(0);
    let t = 0; for (let i = 4500; i < 5000; i++) t += Math.abs(c[i]);
    o.audio = t.toFixed(10);
  } catch (e) { o.audio = "ERR:" + e.name; }
  try {
    const ac = new OfflineAudioContext(1, 44100, 44100);
    const osc = ac.createOscillator(); osc.type = "triangle"; osc.frequency.value = 10000;
    const comp = ac.createDynamicsCompressor();
    const an = ac.createAnalyser(); an.fftSize = 2048;
    osc.connect(comp); comp.connect(an); an.connect(ac.destination); osc.start(0);
    await ac.startRendering();
    const f = new Float32Array(an.frequencyBinCount);
    an.getFloatFrequencyData(f);
    let s = 0; for (let i = 0; i < f.length; i++) if (isFinite(f[i])) s += f[i];
    o.audio_analyser = s.toFixed(8);
  } catch (e) { o.audio_analyser = "ERR:" + e.name; }

  // Teclado y batería (GAB-141, GAB-145): si la API existe y qué dice.
  o.keyboard_api = "keyboard" in navigator;
  if (o.keyboard_api) {
    try {
      const m = await navigator.keyboard.getLayoutMap();
      o.teclado = ["KeyQ", "KeyW", "KeyY", "KeyZ", "Semicolon", "BracketLeft", "Quote"]
        .map((k) => m.get(k) ?? "-").join("");
    } catch (e) { o.teclado = "ERR:" + e.name; }
  }
  try {
    const b = await navigator.getBattery();
    o.bateria = b.charging + "/" + b.level;
  } catch (e) { o.bateria = "ERR:" + e.name; }

  // WebGPU (GAB-139): lo que depende de la placa. Los `limits` salen en los
  // escalones de Chrome; los `features` y el subgrupo, no.
  estado("midiendo WebGPU…");
  try {
    const a = await navigator.gpu.requestAdapter();
    if (!a) {
      o.webgpu = "sin adapter";
    } else {
      o.webgpu = a.info.vendor + "/" + a.info.architecture;
      o.webgpu_subgrupo = a.info.subgroupMinSize + "-" + a.info.subgroupMaxSize;
      o.webgpu_features = [...a.features].sort().join(",");
      const l = [];
      for (const k in a.limits) l.push(k + "=" + a.limits[k]);
      o.webgpu_limits = l.sort().join(",");
    }
  } catch (e) { o.webgpu = "ERR:" + e.name; }

  // Voces (GAB-140): llegan en tandas, así que se lee la lista final a los 12
  // segundos, no la primera que aparezca.
  estado("esperando las voces…");
  speechSynthesis.getVoices();
  await new Promise((r) => setTimeout(r, 12000));
  const voces = speechSynthesis.getVoices();
  const locales = voces.filter((v) => v.localService);
  o.voces = voces.length + " (" + locales.length + " locales)";
  o.voces_locales = locales.map((v) => v.name + " [" + v.lang + "]").join(" | ") || "-";
  o.voces_remotas = voces.filter((v) => !v.localService).map((v) => v.name).join(" | ") || "-";
  o.voz_por_defecto = (voces.find((v) => v.default) || {}).name || "-";

  const texto = Object.entries(o).map(([k, v]) => k + "=" + v).join("\n");
  let h = 5381;
  for (const ch of texto) h = ((h * 33) ^ ch.charCodeAt(0)) >>> 0;
  document.getElementById("salida").textContent = texto;
  document.getElementById("firma").textContent = "firma " + h.toString(16).padStart(8, "0");
  estado("listo — sacá la captura");
})();
</script>
</html>
